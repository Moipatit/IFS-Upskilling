<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="header">
            <h1>AI Study Assistant</h1>
            <p>Enter a topic and get a study tip</p>

            <form id="studyForm">
                <label for="topic">Study Topic:</label>
                <textarea id="topic" placeholder="Enter a topic" required></textarea>
                <button type="submit" id="generateButton">Generate Tip</button>
            </form>

            <div id="message" aria-live="polite"></div>
            <div id="result"></div>
            <button id="retryButton" class="hidden">Try Again</button>
        </div>
       
    </main>
    <script src="script.js"></script>
</body>
</html>
