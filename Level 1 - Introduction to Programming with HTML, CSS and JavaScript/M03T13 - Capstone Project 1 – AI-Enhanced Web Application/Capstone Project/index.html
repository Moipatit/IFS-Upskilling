<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI meal ordering app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form id="userInput">
        <label for="ingredient">Please enter an ingredient:</label>
        <input id="ingredient" placeholder="E.G Chicken" required>
        <button type="submit" id="searchButton">Search</button>
        <button type = "button" id="retryButton" class="hidden">Try again</button>
    </form>

    <div id="message" aria-live="polite"></div>
    <div id="result"></div>
    <div id="active-orders">
        <button onclick="displayActiveOrders()">Display Active Orders</button>
        <div id="order-list"></div>
    </div>

    <div id="complete-orders">
        <label for="orderNumber">Please enter an order number:</label>
        <input id="orderNumber" placeholder="1" required>
        <button onclick="completeOrders()">Complete an order</button>
    </div>

    <script src="main.js"></script>

</body>
</html>
