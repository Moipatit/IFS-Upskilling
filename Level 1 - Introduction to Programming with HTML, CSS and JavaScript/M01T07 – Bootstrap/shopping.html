<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Arabian Perfumes</h1>

        <div class="row g-4">
            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">

                    </div>
                    <div class="p-3">
                        <h5>Lattafa Eclaire</h5>
                        <p class="price">R 899</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2y_dfsOpkgqD0vGLmo2galVTA-fJBA3H-Z5RIDnp-PA&s=10" class="product-image img-fluid" alt="Lattafa Nebras">
                    </div>
                    <div class="p-3">
                        <h5>Lattafa Nebras</h5>
                        <p class="price">R 1,299</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQoSzO3TZmOIIfx80Qq-OWcbzA_PLXQAFllSjqaHGJbcQ&s=10" class="product-image img-fluid" alt="Lattafa Yara">
                    </div>
                    <div class="p-3">
                        <h5>Lattafa Yara</h5>
                        <p class="price">R 1,499</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmRIfJeGvwHT3nRoXb9rR1K5n3l-ptKRXGjtj2HrWA9A&s" class="product-image img-fluid" alt="Lattafa Angham">
                    </div>
                    <div class="p-3">
                        <h5>Lattafa Angham</h5>
                        <p class="price">R 2,199</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRj12bKSyLoRMIZU_p_BqesqvFb9cOI9udTkGQ3RN1oVg&s=10" class="product-image img-fluid" alt="Lattafa Khamrah Qahwa">
                    </div>
                    <div class="p-3">
                        <h5>Lattafa Khamrah Qahwa</h5>
                        <p class="price">R 399</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQfpL7mEaV2qnOBDS_xBhxEX66FM3x6dXZHew59vNEmfw&s=10" class="product-image img-fluid" alt="Marshmallow Blush">
                    </div>
                    <div class="p-3">
                        <h5>Paris Corner Marshmallow Blush</h5>
                        <p class="price">R 2,899</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR8IiW5kP-69r6JODkGgkIkCsTjbE-hoZpSRJ7fsXbkMw&s=10" class="product-image img-fluid" alt="Khair Confection">
                    </div>
                    <div class="p-3">
                        <h5>Paris Corner Khair Confection</h5>
                        <p class="price">R 549</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS65AuA1z49rzXNtGZixcnauTThnkvfNHHelo0fhhuN9Q&s" class="product-image img-fluid" alt="Khair Felicity">
                    </div>
                    <div class="p-3">
                        <h5>Khair Felicity</h5>
                        <p class="price">R 699</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVlRizun21QP7jvIBGhk01rSNbT2cS8jXj96mOLqLXjQ&s=10" class="product-image img-fluid" alt="khair Pistachio">
                    </div>
                    <div class="p-3">
                        <h5>Khair Pistachio</h5>
                        <p class="price">R 249</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                <div class="product-card h-100">
                    <div class="product-image-wrapper">
                        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ0z6u2yOK14yrF-XzFqfsJZI-T0GnZLuHCz2BL3SEE2w&s=10" class="product-image img-fluid" alt="Molten Caramel">
                    </div>
                    <div class="p-3">
                        <h5>Molten Caramel</h5>
                        <p class="price">R 3,499</p>
                        <button class="btn btn-primary buy-btn">Buy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <div class="row align-items-center g-3">
                <div class="col-md-2 d-flex justify-content-center justify-content-md-start">
                    <div class="company-logo">M</div>
                </div>

                <div class="col-md-10">
                    <form class="footer-form row g-2 align-items-end">
                        <div class="col-md-4">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName" placeholder="Your first name">
                        </div>
                        <div class="col-md-4">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" placeholder="you@example.com">
                        </div>
                        <div class="col-md-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" placeholder="+27 12 345 6789">
                        </div>
                        <div class="col-md-1 d-grid">
                            <button type="submit" class="btn btn-primary">Send</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
