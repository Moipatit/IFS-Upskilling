<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search and Recommendation system</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Course Finder</h1>
            <p>The tool in this page uses sample embeddings to simulate semantic search</p>
        </header>

        <section class="search-section">
            <form id="form">
                <label for="query">What would you like to learn?</label>
                <div class="search-controls">
                    <input type="text" id="query" name="query" placeholder="e.g. learn react" required>
                    <button type="button" id="myButton">Search</button>
                </div>
            </form>
        </section>

        <section class="results-section">
            <div id="search-results"></div>
        </section>

        <section class="recommendations-section">
            <div id="recommendations"></div>
        </section>
    </main>

    <script src="courses.js"></script>
    <script src="script.js"></script>
</body>
</html>
